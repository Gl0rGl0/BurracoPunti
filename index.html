<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Burraco - Gestione Torneo</title>
  <meta http-equiv="refresh" content="0; url=src/">
  <script src="src/js/config.js"></script>
  <script>
    if (typeof BURRACO_CONFIG !== 'undefined' && BURRACO_CONFIG.appTitle) {
      document.title = BURRACO_CONFIG.appTitle;
    }
    window.location.replace("src/");
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding-top: 60px; background-color: #0F172A; color: #F8FAFC;">
  <h2 id="loading-heading">Caricamento Burraco in corso...</h2>
  <script>
    if (typeof BURRACO_CONFIG !== 'undefined' && BURRACO_CONFIG.brandName) {
      const el = document.getElementById('loading-heading');
      if (el) el.textContent = `Caricamento ${BURRACO_CONFIG.brandName} in corso...`;
    }
  </script>
  <p><a href="src/" style="color: #60A5FA; text-decoration: none;">Clicca qui se non vieni reindirizzato automaticamente</a></p>
</body>
</html>
